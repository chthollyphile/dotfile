source = ~/.config/omarchy/current/theme/hyprlock.conf
 
general {
    ignore_empty_input = true
    immediate_render = true
}

background {
    monitor =
    color = $color
    path = ~/.config/omarchy/current/background-lock
    blur_passes = 3
    blur_size = 7
}

animations {
    enabled = true
}

input-field {
    monitor =
    size = 650, 100
    position = 0, -150
    halign = center
    valign = center

    inner_color = rgba(255, 255, 255, 0.1)
    outer_color = $source_color
    outline_thickness = 3

    font_family = CaskaydiaMono Nerd Font
    font_color = $font_color

    placeholder_text = as the Nights Reincarnation...
    check_color = $check_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    fade_on_empty = true

    rounding = 22
    shadow_passes = 0
    fade_on_empty = false
}

auth {
    fingerprint:enabled = false
}

