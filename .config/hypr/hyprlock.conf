# Hours
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%H") </big></b>"
    color = rgba(255, 255, 255, 1.0)
    font_size = 160
    font_family = JetBrainsMono Nerd Font Propo
    shadow_passes = 1
    shadow_size = 0
    shadow_color = rgba(94, 94, 94, 0.5)

    position = 0, 420
    halign = center
    valign = center
}

# Minutes
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%M") </big></b>"
    color = rgba(255, 255, 255, 1.0)
    font_size = 160
    font_family = JetBrainsMono Nerd Font Propo
    shadow_passes = 1
    shadow_size = 0
    shadow_color = rgba(94, 94, 94, 0.5)

    position = 0, 220
    halign = center
    valign = center
}


